services:
  playwright:
    build: .
    environment:
      CI: "true"
      ORANGEHRM_BASE_URL: ${ORANGEHRM_BASE_URL:-https://opensource-demo.orangehrmlive.com}
      ORANGEHRM_ADMIN_USERNAME: ${ORANGEHRM_ADMIN_USERNAME:-Admin}
      ORANGEHRM_ADMIN_PASSWORD: ${ORANGEHRM_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
      - ./allure-results:/app/allure-results
      - ./ai-results:/app/ai-results
